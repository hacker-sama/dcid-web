services:
  postgres:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  redis:
    ports: []

  minio:
    ports: []
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  backend:
    ports:
      - "8080:8080"
    environment:
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    deploy:
      resources:
        limits:
          memory: 1G

  ai:
    ports: []
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      LM_STUDIO_MODEL: ${LLM_MODEL:-qwen2.5vl:3b}
    deploy:
      resources:
        limits:
          memory: 2G

  ai-worker:
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      LM_STUDIO_MODEL: ${LLM_MODEL:-qwen2.5vl:3b}
    deploy:
      resources:
        limits:
          memory: 2G

  ai-flower:
    ports: []

  ai-ocr:
    ports: []
    environment:
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
    deploy:
      resources:
        limits:
          memory: 1G

  chroma:
    ports: []
    deploy:
      resources:
        limits:
          memory: 2G

  ollama:
    ports: []
    deploy:
      resources:
        limits:
          memory: 4G

  kafka:
    ports: []

  zookeeper:
    ports: []
