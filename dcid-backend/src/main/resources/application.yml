spring:
  application:
    name: smart-kcn-docs-backend
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/dcid}
    username: ${POSTGRES_USER:dcid}
    password: ${POSTGRES_PASSWORD:dcid_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: smart-kcn-docs
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # HMAC-SHA256 secret (>= 32 bytes). MUST be overridden per environment via APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:change-me-dev-secret-please-override-32b+}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:28800000}   # 8h
    issuer: ${APP_JWT_ISSUER:smart-kcn-docs}
  bootstrap:
    admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:admin123}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:kcn-docs}
  rate-limit:
    submissions-per-hour: ${RATE_LIMIT_SUBMISSIONS:10}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] [%thread] %-5level %logger{36} - %msg%n"
  level:
    vn.dcid: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
