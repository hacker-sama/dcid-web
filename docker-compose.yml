 # docker-compose.yml – root of the repository (dcid‑web)

  # Shared named volumes so data survives container restarts
  volumes:
    postgres_data: {}
    minio_data: {}

  services:
    postgres:
      image: postgres:16
      container_name: dcid-postgres
      environment:
        POSTGRES_DB: dcid
        POSTGRES_USER: dcid
        POSTGRES_PASSWORD: dcid
      volumes:
        - postgres_data:/var/lib/postgresql/data
      restart: unless-stopped

    redis:
      image: redis:7
      container_name: dcid-redis
      command: ["redis-server", "--save", "900 1", "--loglevel", "warning"]
      restart: unless-stopped

    minio:
      # official MinIO image – use the latest stable release tag that is on Docker Hub
      image: minio/minio:latest
      container_name: dcid-minio
      environment:
        MINIO_ROOT_USER: minio
        MINIO_ROOT_PASSWORD: minio123
      command: ["server", "/data"]
      volumes:
        - minio_data:/data
      ports:
        - "9000:9000"
      restart: unless-stopped

    keycloak:
      image: quay.io/keycloak/keycloak:26.0
      container_name: dcid-keycloak
      environment:
        KEYCLOAK_ADMIN: admin
        KEYCLOAK_ADMIN_PASSWORD: admin
      command: ["start-dev"]
      ports:
        - "8180:8080"
      restart: unless-stopped

    backend:
      build:
        context: ./dcid-backend
        dockerfile: Dockerfile
      container_name: dcid-backend
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dcid
        SPRING_DATASOURCE_USERNAME: dcid
        SPRING_DATASOURCE_PASSWORD: dcid
        SPRING_REDIS_HOST: redis
        SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        MINIO_ENDPOINT: http://minio:9000
        MINIO_ACCESS_KEY: minio
        MINIO_SECRET_KEY: minio123
        KEYCLOAK_ISSUER: http://keycloak:8080/realms/dcid
      depends_on:
        - postgres
        - redis
        - minio
        - keycloak
      ports:
        - "8080:8080"
      restart: unless-stopped

    frontend:
      build:
        context: ./dcid-frontend
        dockerfile: Dockerfile
      container_name: dcid-frontend
      environment:
        NEXTAUTH_URL: http://localhost:3000
        NEXTAUTH_SECRET: change-me-in-production
        KEYCLOAK_ISSUER: http://keycloak:8080/realms/dcid
        KEYCLOAK_CLIENT_ID: dcid-frontend
        KEYCLOAK_CLIENT_SECRET: change-me
        NEXT_PUBLIC_API_URL: http://backend:8080
        NEXT_PUBLIC_WS_URL: ws://backend:8080
      ports:
        - "3000:3000"
      depends_on:
        - backend
        - keycloak
      restart: unless-stopped

    kafka:
      # We use the official Confluent Kafka image for a single‑node broker
      image: confluentinc/cp-kafka:7.5.0
      container_name: dcid-kafka
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      depends_on:
        - zookeeper
      ports:
        - "9092:9092"
      restart: unless-stopped

    zookeeper:
      image: confluentinc/cp-zookeeper:7.5.0
      container_name: dcid-zookeeper
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
      ports:
        - "2181:2181"
      restart: unless-stopped