# Shared named volumes so data survives container restarts
volumes:
  postgres_data: {}
  minio_data: {}
  chroma_data: {}  # ChromaDB persistent vector index (T2 — M1c)

services:
  postgres:
    image: postgres:16
    container_name: dcid-postgres
    environment:
      POSTGRES_DB: dcid
      POSTGRES_USER: dcid
      POSTGRES_PASSWORD: dcid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port 5433 (không phải 5432 mặc định) — tránh đụng độ với PostgreSQL
      # cài sẵn trên máy dev (rất hay gặp). Container backend dùng service name
      # `postgres:5432` qua mạng nội bộ compose, không bị ảnh hưởng bởi mapping này.
      - "5433:5432"
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: dcid-redis
    command: ["redis-server", "--save", "900 1", "--loglevel", "warning"]
    restart: unless-stopped

  minio:
    # official MinIO image – use the latest stable release tag that is on Docker Hub
    image: minio/minio:latest
    container_name: dcid-minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: ["server", "/data"]
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
    restart: unless-stopped

  backend:
    build:
      context: ./dcid-backend
      dockerfile: Dockerfile
    container_name: dcid-backend
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/dcid
      POSTGRES_USER: dcid
      POSTGRES_PASSWORD: dcid
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      # Self-issued JWT — override with a strong 32+ byte secret in real deployments
      APP_JWT_SECRET: change-me-in-prod-please-use-a-long-random-secret
      APP_BOOTSTRAP_ADMIN_PASSWORD: admin123
      AI_BASE_URL: http://ai:8000
      AI_INTERNAL_TOKEN: change-me-internal-token
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8080:8080"
    restart: unless-stopped

  ai:
    build:
      context: ./dcid-ai
      dockerfile: Dockerfile
    container_name: dcid-ai
    environment:
      AI_INTERNAL_TOKEN: change-me-internal-token
      BE_BASE_URL: http://backend:8080
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: kcn-docs
      OCR_SERVICE_URL: http://ai-ocr:8001
      # ChromaDB — khớp service name trong compose (port nội bộ 8000)
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    depends_on:
      - minio
      - chroma
      - ai-ocr
    ports:
      - "8000:8000"
    restart: unless-stopped

  ai-ocr:
    build:
      context: ./dcid-ai
      dockerfile: Dockerfile.ocr
    container_name: dcid-ai-ocr
    environment:
      AI_INTERNAL_TOKEN: change-me-internal-token
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: kcn-docs
    depends_on:
      - minio
    ports:
      - "8002:8001"
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: dcid-chroma
    volumes:
      - chroma_data:/chroma/.chroma/index
    ports:
      - "8001:8000"  # host 8001 tránh đụng với dcid-ai (8000)
    restart: unless-stopped

  kafka:
    # We use the official Confluent Kafka image for a single-node broker
    image: confluentinc/cp-kafka:7.5.0
    container_name: dcid-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dcid-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped