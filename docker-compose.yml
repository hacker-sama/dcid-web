# Shared named volumes so data survives container restarts
volumes:
  postgres_data: {}
  minio_data: {}
  qdrant_data: {}  # Qdrant persistent vector index
  redis_data: {}   # Redis persistence cho Celery task results
  ollama_data: {}
  paddle_models: {}
  hf_models: {}

services:
  postgres:
    image: postgres:16
    container_name: dcid-postgres
    environment:
      POSTGRES_DB: dcid
      POSTGRES_USER: dcid
      POSTGRES_PASSWORD: dcid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port 5433 (không phải 5432 mặc định) — tránh đụng độ với PostgreSQL
      # cài sẵn trên máy dev (rất hay gặp). Container backend dùng service name
      # `postgres:5432` qua mạng nội bộ compose, không bị ảnh hưởng bởi mapping này.
      - "5433:5432"
    mem_limit: 320m
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: dcid-redis
    command:
      - redis-server
      - --save
      - "900 1"
      - --loglevel
      - warning
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"  # Expose ra host để dev local debug / kiểm tra Celery queue
    mem_limit: 96m
    restart: unless-stopped

  minio:
    # official MinIO image – use the latest stable release tag that is on Docker Hub
    image: minio/minio:latest
    container_name: dcid-minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: ["server", "/data"]
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
    mem_limit: 192m
    restart: unless-stopped

  backend:
    build:
      context: ./dcid-backend
      dockerfile: Dockerfile
    container_name: dcid-backend
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/dcid
      POSTGRES_USER: dcid
      POSTGRES_PASSWORD: dcid
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      # Self-issued JWT — override with a strong 32+ byte secret in real deployments
      APP_JWT_SECRET: change-me-in-prod-please-use-a-long-random-secret
      APP_BOOTSTRAP_ADMIN_PASSWORD: admin123
      AI_BASE_URL: http://ai:8000
      AI_INTERNAL_TOKEN: change-me-internal-token
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=20
        -XX:MaxRAMPercentage=70
        -XX:MaxMetaspaceSize=128m
        -XX:+UseSerialGC
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8080:8080"
    mem_limit: 512m
    restart: unless-stopped

  ai:
    build:
      context: ./dcid-ai
      dockerfile: Dockerfile
    container_name: dcid-ai
    environment:
      AI_INTERNAL_TOKEN: change-me-internal-token
      BE_BASE_URL: http://backend:8080
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: kcn-docs
      OCR_SERVICE_URL: http://ai-ocr:8001
      # Qdrant — service nội bộ trên REST port 6333
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_VECTOR_SIZE: 384
      QDRANT_VECTORS_ON_DISK: "true"
      QDRANT_HNSW_ON_DISK: "true"
      QDRANT_PAYLOAD_ON_DISK: "true"
      # Redis — Celery broker/backend (service `redis`, port nội bộ 6379)
      REDIS_URL: redis://redis:6379/0
      AI_RESOURCE_GATE_ENABLED: "true"
      AI_RESOURCE_GATE_FAIL_OPEN: "false"
      AI_RESOURCE_LOCK_WAIT_SECONDS: "330"
      LM_STUDIO_BASE_URL: http://ollama:11434/v1
      LM_STUDIO_API_KEY: ollama
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      LM_STUDIO_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
      VISION_MODEL: ${VISION_MODEL:-qwen2.5vl:3b}
      LLM_CONTEXT_WINDOW: "4096"
      LLM_MAX_TOKENS: "768"
    volumes:
      - hf_models:/root/.cache/huggingface
    depends_on:
      - minio
      - qdrant
      - ai-ocr
      - redis
      - ollama
    ports:
      - "8000:8000"
    mem_limit: 512m
    restart: unless-stopped

  # ── Celery Worker: chạy Embed/Index pipeline bất đồng bộ ─────────────────
  ai-worker:
    build:
      context: ./dcid-ai
      dockerfile: Dockerfile
    container_name: dcid-ai-worker
    # Worker chạy Celery thay vì uvicorn
    command: ["celery", "-A", "app.celery_app.celery_app", "worker",
              "--loglevel=info", "--concurrency=1", "--prefetch-multiplier=1",
              "--max-tasks-per-child=1", "-Q", "ingest,default"]
    environment:
      AI_INTERNAL_TOKEN: change-me-internal-token
      BE_BASE_URL: http://backend:8080
      OCR_SERVICE_URL: http://ai-ocr:8001
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: kcn-docs
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_VECTOR_SIZE: 384
      QDRANT_VECTORS_ON_DISK: "true"
      QDRANT_HNSW_ON_DISK: "true"
      QDRANT_PAYLOAD_ON_DISK: "true"
      REDIS_URL: redis://redis:6379/0
      AI_RESOURCE_GATE_ENABLED: "true"
      AI_RESOURCE_GATE_FAIL_OPEN: "false"
      AI_RESOURCE_LOCK_WAIT_SECONDS: "330"
      LM_STUDIO_BASE_URL: http://ollama:11434/v1
      LM_STUDIO_API_KEY: ollama
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
      LM_STUDIO_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
      VISION_MODEL: ${VISION_MODEL:-qwen2.5vl:3b}
      LLM_CONTEXT_WINDOW: "4096"
      LLM_MAX_TOKENS: "768"
    volumes:
      - hf_models:/root/.cache/huggingface
    depends_on:
      - redis
      - minio
      - qdrant
      - ai-ocr
      - ollama
    mem_limit: 896m
    restart: unless-stopped

  # ── Flower: Celery monitoring UI (http://localhost:5555) ─────────────────
  ai-ocr:
    build:
      context: ./dcid-ai
      dockerfile: Dockerfile.ocr
    container_name: dcid-ai-ocr
    environment:
      AI_INTERNAL_TOKEN: change-me-internal-token
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio123
      MINIO_BUCKET: kcn-docs
    volumes:
      # OCR dependencies are heavy; mount application code so local changes do not
      # require exporting a multi-GB Paddle image on every rebuild.
      - ./dcid-ai/app:/srv/dcid-ai/app:ro
      - paddle_models:/root/.paddlex
    depends_on:
      - minio
    ports:
      - "8002:8001"
    mem_limit: 640m
    restart: unless-stopped

